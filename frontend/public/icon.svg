<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 原创图标:一个中心节点 + 三个外围节点,表示局域网里的设备。
       粗线条 + 大圆点,为的是 16px 的标签页上也还认得出来。 -->
  <rect width="32" height="32" rx="7" fill="#1b1b1f"/>
  <g stroke="#7dd3a0" stroke-width="2" stroke-linecap="round">
    <line x1="16" y1="16" x2="8"  y2="8"/>
    <line x1="16" y1="16" x2="24" y2="9"/>
    <line x1="16" y1="16" x2="15" y2="25"/>
  </g>
  <circle cx="16" cy="16" r="4.6" fill="#7dd3a0"/>
  <circle cx="8"  cy="8"  r="3"   fill="#e8e8ea"/>
  <circle cx="24" cy="9"  r="3"   fill="#e8e8ea"/>
  <circle cx="15" cy="25" r="3"   fill="#e8e8ea"/>
</svg>
